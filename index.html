  // ==================== DECK ====================
  function createDeck() {
    var deck = [];
    var id = 0;
    for (var d = 0; d < 2; d++) {
      for (var si = 0; si < SUITS.length; si++) {
        for (var ri = 0; ri < RANKS.length; ri++) {
          deck.push({ suit: SUITS[si], rank: RANKS[ri], id: id++ });
        }
      }
      deck.push({ suit: "joker", rank: "BJ", id: id++ });
      deck.push({ suit: "joker", rank: "RJ", id: id++ });
    }
    return deck;
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function deal() {
    var deck = shuffle(createDeck());
    for (var i = 0; i < 4; i++) { gameState.hands[i] = []; }
    for (var k = 0; k < 108; k++) { gameState.hands[k % 4].push(deck[k]); }
    for (var m = 0; m < 4; m++) { sortHand(gameState.hands[m]); }
  }

  function getLevelRankName() {
    return RANKS[gameState.level - 2];
  }

  function cardValue(card) {
    if (card.rank === "RJ") return 100;
    if (card.rank === "BJ") return 99;
    var v = RANK_ORDER[card.rank] || 0;
    if (card.rank === getLevelRankName()) v = 15.5;
    return v;
  }

  function isWild(card) {
    return card.suit === "\u2665" && card.rank === getLevelRankName();
  }

  function sortHand(hand) {
    hand.sort(function(a, b) {
      var diff = cardValue(b) - cardValue(a);
      if (diff !== 0) return diff;
      return a.suit > b.suit ? 1 : -1;
    });
  }

  function getCardColor(card) {
    if (card.rank === "RJ") return "color-joker-red";
    if (card.rank === "BJ") return "color-joker-black";
    if (card.suit === "\u2665" || card.suit === "\u2666") return "color-red";
    return "color-black";
  }

  function levelName(lv) {
    if (lv > 14) return "\u2605"; // star for passed A
    return RANKS[lv - 2] || "2";
  }

  // ==================== RENDERING ====================
  function renderHand() {
    var container = document.getElementById("handContainer");
    container.innerHTML = "";
    var cards = gameState.hands[0];
    var n = cards.length;
    if (n === 0) return;

    var inner = document.createElement("div");
    inner.className = "hand-inner";
    var screenW = container.clientWidth || (window.innerWidth - 12);
    var cardW = 42;
    var cardH = 62;
    if (window.innerWidth <= 400) { cardW = 36; cardH = 54; }

    var minStep = 17;
    var singleRowWidth = cardW + (n - 1) * minStep;

    if (singleRowWidth <= screenW) {
      var step = n > 1 ? Math.min(cardW + 2, Math.floor((screenW - cardW) / (n - 1))) : 0;
      var totalW = cardW + (n - 1) * step;
      inner.style.width = totalW + "px";
      inner.style.height = (cardH + 12) + "px";
      container.style.minHeight = (cardH + 16) + "px";
      for (var i = 0; i < cards.length; i++) {
        var div = makeCardElement(cards[i], i);
        div.style.left = (i * step) + "px";
        div.style.top = cards[i]._selected ? "0px" : "12px";
        div.style.zIndex = String(i);
        inner.appendChild(div);
      }
    } else {
      var half = Math.ceil(n / 2);
      var row1 = cards.slice(0, half);
      var row2 = cards.slice(half);
      var step1 = half > 1 ? Math.max(minStep, Math.min(cardW + 2, Math.floor((screenW - cardW) / (half - 1)))) : 0;
      var step2 = row2.length > 1 ? Math.max(minStep, Math.min(cardW + 2, Math.floor((screenW - cardW) / (row2.length - 1)))) : 0;
      var totalW1 = cardW + (half - 1) * step1;
      var totalW2 = cardW + (row2.length - 1) * step2;
      var totalWidth = Math.max(totalW1, totalW2);
      var rowGap = Math.floor(cardH * 0.42);
      inner.style.width = totalWidth + "px";
      inner.style.height = (cardH + rowGap + 12) + "px";
      container.style.minHeight = (cardH + rowGap + 18) + "px";
      var offset1 = Math.floor((totalWidth - totalW1) / 2);
      var offset2 = Math.floor((totalWidth - totalW2) / 2);
      for (var a = 0; a < row1.length; a++) {
        var d1 = makeCardElement(row1[a], a);
        d1.style.left = (offset1 + a * step1) + "px";
        d1.style.top = row1[a]._selected ? "-8px" : "0px";
        d1.style.zIndex = String(a);
        inner.appendChild(d1);
      }
      for (var b = 0; b < row2.length; b++) {
        var d2 = makeCardElement(row2[b], half + b);
        d2.style.left = (offset2 + b * step2) + "px";
        d2.style.top = row2[b]._selected ? (rowGap - 8) + "px" : rowGap + "px";
        d2.style.zIndex = String(50 + b);
        inner.appendChild(d2);
      }
    }
    container.appendChild(inner);
  }

  function makeCardElement(card, index) {
    var div = document.createElement("div");
    div.className = "player-card " + getCardColor(card);
    if (isWild(card)) div.className += " wild-card";
    if (card._selected) div.className += " selected";
    if (card.rank === "RJ") {
      div.innerHTML = '<span class="card-rank">\u5927</span><span class="card-suit">\u738b</span>';
    } else if (card.rank === "BJ") {
      div.innerHTML = '<span class="card-rank">\u5c0f</span><span class="card-suit">\u738b</span>';
    } else {
      div.innerHTML = '<span class="card-rank">' + card.rank + '</span><span class="card-suit">' + card.suit + '</span>';
    }
    div.setAttribute("data-index", String(index));
    div.addEventListener("click", function() { toggleCard(index); });
    return div;
  }

  function toggleCard(index) {
    if (gameState.currentPlayer !== 0 || !gameState.roundActive) return;
    gameState.hands[0][index]._selected = !gameState.hands[0][index]._selected;

  }

  function renderMiniCards(cards) {

    else if (n <= 2) { cw = 58; ch = 82; fs = 26; ss = 20; }
    else if (n <= 3) { cw = 52; ch = 74; fs = 24; ss = 18; }
    else if (n <= 5) { cw = 46; ch = 66; fs = 21; ss = 16; }
    else { cw = 40; ch = 58; fs = 18; ss = 14; }

    var maxTotal = 200;
    var gap = n > 1 ? Math.min(cw + 3, Math.floor((maxTotal - cw) / (n - 1))) : 0;
    var ml = gap - cw;

    var html = "";
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var cls = "mini-card " + getCardColor(card);
      var style = "width:" + cw + "px;height:" + ch + "px;font-size:" + fs + "px;";
      if (i > 0) style += "margin-left:" + ml + "px;";
      style += "z-index:" + i + ";position:relative;";
      var inner = "";
      if (card.rank === "RJ") {
        inner = '<span>\u5927</span><span class="mini-suit" style="font-size:' + ss + 'px">\u738b</span>';
      } else if (card.rank === "BJ") {

      } else {
        inner = '<span>' + card.rank + '</span><span class="mini-suit" style="font-size:' + ss + 'px">' + card.suit + '</span>';
      }

  // ==================== CARD TYPE DETECTION ====================
  function detectType(cards) {
    if (!cards || cards.length === 0) return null;
    var n = cards.length;
    var vals = [];
    for (var i = 0; i < cards.length; i++) {
      vals.push({ v: cardValue(cards[i]), suit: cards[i].suit, rank: cards[i].rank, wild: isWild(cards[i]) });
    }
    vals.sort(function(a, b) { return a.v - b.v; });

    // Tianwang (4 jokers)
    if (n === 4) {
      var jokerCount = 0;
      for (var j = 0; j < cards.length; j++) {
        if (cards[j].rank === "RJ" || cards[j].rank === "BJ") jokerCount++;
      }
      if (jokerCount === 4) return { type: "tianwang", rank: 200, count: 4, cards: cards };
    }

    var wilds = [];
    var normals = [];
    for (var w = 0; w < vals.length; w++) {
      if (vals[w].wild) wilds.push(vals[w]); else normals.push(vals[w]);
    }
    var wc = wilds.length;

    // Single
    if (n === 1) return { type: "single", rank: vals[0].v, count: 1, cards: cards };

    // Group normals by value
    var normGroups = {};
    for (var ng = 0; ng < normals.length; ng++) {
      var nv = normals[ng].v;
      normGroups[nv] = (normGroups[nv] || 0) + 1;
    }
    var normKeys = Object.keys(normGroups).map(Number).sort(function(a,b){return a-b;});

    // Pair
    if (n === 2) {
      if (wc === 0 && normals[0].v === normals[1].v) return { type: "pair", rank: normals[0].v, count: 2, cards: cards };
      if (wc >= 1 && normals.length >= 1) return { type: "pair", rank: normals[0].v, count: 2, cards: cards };
      if (wc === 2) return { type: "pair", rank: vals[0].v, count: 2, cards: cards };
    }

    // Triple
    if (n === 3) {
      for (var tk = 0; tk < normKeys.length; tk++) {
        if ((normGroups[normKeys[tk]] || 0) + wc >= 3) return { type: "triple", rank: normKeys[tk], count: 3, cards: cards };
      }
      if (wc >= 2 && normals.length >= 1) return { type: "triple", rank: normals[normals.length - 1].v, count: 3, cards: cards };
    }

    // All-value counts
    var allCounts = {};
    for (var ac = 0; ac < vals.length; ac++) {
      allCounts[vals[ac].v] = (allCounts[vals[ac].v] || 0) + 1;
    }
    var allEntries = [];
    for (var key in allCounts) {
      if (allCounts.hasOwnProperty(key)) allEntries.push([Number(key), allCounts[key]]);
    }

    // Bomb (all same, no wilds, 4+)
    if (allEntries.length === 1 && n >= 4 && wc === 0) {
      return { type: "bomb", rank: vals[0].v + n * 0.01, count: n, cards: cards };
    }
    // Bomb with wilds
    if (normals.length > 0 && wc > 0 && n >= 4) {
      var allSameNorm = true;
      for (var bn = 1; bn < normals.length; bn++) {
        if (normals[bn].v !== normals[0].v) { allSameNorm = false; break; }
      }
      if (allSameNorm) return { type: "bomb", rank: normals[0].v + n * 0.01, count: n, cards: cards };
    }

    // Three + Pair (5 cards)
    if (n === 5) {
      if (wc === 0) {
        var countVals = [];
        for (var cv = 0; cv < allEntries.length; cv++) countVals.push(allEntries[cv][1]);
        countVals.sort();
        if (allEntries.length === 2 && countVals[0] === 2 && countVals[1] === 3) {
          var tripleRank = 0;
          for (var tr = 0; tr < allEntries.length; tr++) {
            if (allEntries[tr][1] === 3) tripleRank = allEntries[tr][0];
          }
          return { type: "triple_pair", rank: tripleRank, count: 5, cards: cards };
        }
      }
      if (wc > 0) {
        for (var tpk = 0; tpk < normKeys.length; tpk++) {
          var kk = normKeys[tpk];
          var have = normGroups[kk] || 0;
          var need3 = 3 - have;
          if (need3 < 0 || need3 > wc) continue;
          var remW = wc - need3;
          var otherCount = 0;
          for (var ok = 0; ok < normKeys.length; ok++) {
            if (normKeys[ok] !== kk) otherCount += normGroups[normKeys[ok]];
          }
          if (otherCount + remW >= 2) return { type: "triple_pair", rank: kk, count: 5, cards: cards };
        }
      }
    }

    // Straight (exactly 5 consecutive, values <= 14)
    if (n === 5) {
      for (var start = 2; start <= 10; start++) {
        var needed = 0;
        for (var si2 = 0; si2 < 5; si2++) {
          var target = start + si2;
          var found = false;
          for (var fi = 0; fi < normals.length; fi++) {
            if (normals[fi].v === target) { found = true; break; }
          }
          if (!found) needed++;
        }
        if (needed <= wc) {
          if (wc === 0) {
            var sameSuit = true;
            for (var ss2 = 1; ss2 < vals.length; ss2++) {
              if (vals[ss2].suit !== vals[0].suit) { sameSuit = false; break; }
            }
            if (sameSuit) return { type: "flush_straight", rank: start + 4 + 0.001, count: 5, cards: cards };
          }
          return { type: "straight", rank: start + 4, count: 5, cards: cards };
        }
      }
    }

    // Three consecutive pairs (6 cards) - with wild support
    if (n === 6) {
      // Try all possible starting values for 3 consecutive pairs
      for (var cpStart = 2; cpStart <= 12; cpStart++) {
        if (cpStart + 2 > 14) continue;
        var cpWildsLeft = wc;
        var cpOk = true;
        for (var cpv = cpStart; cpv < cpStart + 3; cpv++) {
          // Count non-wild cards of this value in the selected cards
          var cpHave = 0;
          for (var cpi = 0; cpi < normals.length; cpi++) {
            if (normals[cpi].v === cpv) cpHave++;
          }
          var cpNeed = 2 - cpHave;
          if (cpNeed < 0) cpNeed = 0;
          if (cpNeed > cpWildsLeft) { cpOk = false; break; }
          cpWildsLeft -= cpNeed;
        }
        // Also check all normals are accounted for (no extra normals outside the range)
        if (cpOk && cpWildsLeft === 0) {
          var cpExtraNormals = 0;
          for (var cpn = 0; cpn < normals.length; cpn++) {
            if (normals[cpn].v < cpStart || normals[cpn].v > cpStart + 2) cpExtraNormals++;
          }
          if (cpExtraNormals === 0) {
            return { type: "triple_pair_seq", rank: cpStart + 2, count: 6, cards: cards };
          }
        }
      }
    }

    // Steel plate (6 cards) - with wild support
    if (n === 6) {
      for (var plStart = 2; plStart <= 13; plStart++) {
        if (plStart + 1 > 14) continue;
        var plWildsLeft = wc;
        var plOk = true;
        for (var plv = plStart; plv < plStart + 2; plv++) {
          var plHave = 0;
          for (var pli = 0; pli < normals.length; pli++) {
            if (normals[pli].v === plv) plHave++;
          }
          var plNeed = 3 - plHave;
          if (plNeed < 0) plNeed = 0;
          if (plNeed > plWildsLeft) { plOk = false; break; }
          plWildsLeft -= plNeed;
        }
        if (plOk && plWildsLeft === 0) {
          var plExtraNormals = 0;
          for (var pln = 0; pln < normals.length; pln++) {
            if (normals[pln].v < plStart || normals[pln].v > plStart + 1) plExtraNormals++;
          }
          if (plExtraNormals === 0) {
            return { type: "plate", rank: plStart + 1, count: 6, cards: cards };
          }
        }
      }
    }

    return null;
  }

  function canBeat(play, trick) {
    if (!trick) return play !== null;
    if (!play) return false;
    if (play.type === "tianwang") return true;
    if (trick.type === "tianwang") return false;
    var pBomb = (play.type === "bomb" || play.type === "flush_straight" || play.type === "tianwang");
    var tBomb = (trick.type === "bomb" || trick.type === "flush_straight" || trick.type === "tianwang");
    if (pBomb && !tBomb) return true;
    if (!pBomb && tBomb) return false;
    if (pBomb && tBomb) {
      if (play.type === "flush_straight" && trick.type !== "flush_straight" && trick.type !== "tianwang") return trick.count <= 4;
      if (trick.type === "flush_straight" && play.type !== "flush_straight") return play.count >= 5;
      if (play.count !== trick.count) return play.count > trick.count;
      return play.rank > trick.rank;
    }
    if (play.type !== trick.type || play.count !== trick.count) return false;
    return play.rank > trick.rank;
  }

  // ==================== FIND ALL PLAYS (WITH WILD CARD SUPPORT) ====================
  function findAllPlays(hand, trick) {
    var plays = [];
    var n = hand.length;
    if (n === 0) return plays;

    // Separate wild cards and normal cards
    var wildIndices = [];
    var normalIndices = [];
    for (var w = 0; w < hand.length; w++) {
      if (isWild(hand[w])) wildIndices.push(w);
      else normalIndices.push(w);
    }
    var numWilds = wildIndices.length;

    // Group normal cards by value
    var groups = {};
    for (var i = 0; i < hand.length; i++) {
      var v = cardValue(hand[i]);
      if (!groups[v]) groups[v] = [];
      groups[v].push(i);
    }
    var gKeys = Object.keys(groups).map(Number).sort(function(a,b){return a-b;});

    // Group normal (non-wild) cards by value
    var normGroups = {};
    for (var ni = 0; ni < normalIndices.length; ni++) {
      var nv = cardValue(hand[normalIndices[ni]]);
      if (!normGroups[nv]) normGroups[nv] = [];
      normGroups[nv].push(normalIndices[ni]);
    }
    var normKeys = Object.keys(normGroups).map(Number).sort(function(a,b){return a-b;});

    // Wild card value (for grouping purposes)
    var wildVal = numWilds > 0 ? cardValue(hand[wildIndices[0]]) : -1;

    // Helper: pick indices for a value, using wilds if needed
    // Returns array of indices or null if not enough
    function pickCards(val, needed, usedWilds) {
      var available = normGroups[val] ? normGroups[val].slice() : [];
      // Don't double-use wilds already allocated
      var result = [];
      var wildsNeeded = 0;
      for (var i = 0; i < available.length && result.length < needed; i++) {
        // Skip if this index is a wild (wilds handled separately)
        if (wildIndices.indexOf(available[i]) >= 0) continue;
        result.push(available[i]);
      }
      wildsNeeded = needed - result.length;
      if (wildsNeeded > numWilds - usedWilds) return null;
      // Add wild indices
      var wUsed = 0;
      for (var wi = 0; wi < wildIndices.length && wUsed < wildsNeeded; wi++) {
        // Check wild not already used in usedWilds count
        result.push(wildIndices[wi + usedWilds]); // This is simplified; proper tracking below
        wUsed++;
      }
      if (result.length < needed) return null;
      return { indices: result, wildsUsed: wildsNeeded };
    }

    // Better helper: allocate specific wild indices
    function allocateWilds(needed, excludeWilds) {
      var result = [];
      for (var wi = 0; wi < wildIndices.length && result.length < needed; wi++) {
        if (excludeWilds.indexOf(wildIndices[wi]) < 0) {
          result.push(wildIndices[wi]);
        }
      }
      return result.length >= needed ? result : null;
    }

    // Get non-wild cards of a value
    function getNonWild(val) {
      var result = [];
      if (!normGroups[val]) return result;
      for (var i = 0; i < normGroups[val].length; i++) {
        if (wildIndices.indexOf(normGroups[val][i]) < 0) result.push(normGroups[val][i]);
      }
      return result;
    }

    // Deduplicate plays by type+rank+count
    function addPlay(list, play) {
      list.push(play);
    }

    if (!trick) {
      // ===== FREE LEAD =====

      // Singles (including wilds as their face value)
      for (var s = 0; s < gKeys.length; s++) {
        addPlay(plays, {type:"single",rank:gKeys[s],count:1,indices:[groups[gKeys[s]][0]]});
      }

      // Pairs: normal pairs + wild-assisted pairs
      for (var p = 0; p < gKeys.length; p++) {
        if (groups[gKeys[p]].length >= 2) {
          addPlay(plays, {type:"pair",rank:gKeys[p],count:2,indices:groups[gKeys[p]].slice(0,2)});
        }
      }
      // Wild + any single card = pair
      if (numWilds >= 1) {
        for (var wp = 0; wp < normKeys.length; wp++) {
          var wpv = normKeys[wp];
          if (wpv === wildVal) continue; // already counted above
          var wpCards = getNonWild(wpv);
          if (wpCards.length >= 1) {
            addPlay(plays, {type:"pair",rank:wpv,count:2,indices:[wpCards[0], wildIndices[0]]});
          }
        }
      }

      // Triples: normal + wild-assisted
      for (var t = 0; t < gKeys.length; t++) {
        if (groups[gKeys[t]].length >= 3) {
          addPlay(plays, {type:"triple",rank:gKeys[t],count:3,indices:groups[gKeys[t]].slice(0,3)});
        }
      }
      // 2 normals + 1 wild = triple
      if (numWilds >= 1) {
        for (var wt = 0; wt < normKeys.length; wt++) {
          var wtv = normKeys[wt];
          var wtCards = getNonWild(wtv);
          if (wtCards.length >= 2 && wtv !== wildVal) {
            addPlay(plays, {type:"triple",rank:wtv,count:3,indices:[wtCards[0], wtCards[1], wildIndices[0]]});
          }
        }
      }
      // 1 normal + 2 wilds = triple
      if (numWilds >= 2) {
        for (var wt2 = 0; wt2 < normKeys.length; wt2++) {
          var wt2v = normKeys[wt2];
          var wt2Cards = getNonWild(wt2v);
          if (wt2Cards.length >= 1 && wt2v !== wildVal) {
            addPlay(plays, {type:"triple",rank:wt2v,count:3,indices:[wt2Cards[0], wildIndices[0], wildIndices[1]]});
          }
        }
      }

      // Bombs (only pure, no wilds - wilds in bombs handled by groups already)
      for (var b = 0; b < gKeys.length; b++) {
        if (groups[gKeys[b]].length >= 4) {
          for (var bc = 4; bc <= groups[gKeys[b]].length; bc++) {
            addPlay(plays, {type:"bomb",rank:gKeys[b]+bc*0.01,count:bc,indices:groups[gKeys[b]].slice(0,bc)});
          }
        }
      }

      // Three+pair (including wild-assisted)
      // For each possible triple (with/without wilds), find a pair (with/without wilds)
      var allTriples = []; // {rank, indices, wildsUsed:[indices]}
      for (var tp1 = 0; tp1 < gKeys.length; tp1++) {
        if (groups[gKeys[tp1]].length >= 3) {
          allTriples.push({rank:gKeys[tp1], indices:groups[gKeys[tp1]].slice(0,3), wIdx:[]});
        }
      }
      if (numWilds >= 1) {
        for (var tp1w = 0; tp1w < normKeys.length; tp1w++) {
          var tpv = normKeys[tp1w];
          var tpC = getNonWild(tpv);
          if (tpC.length >= 2 && tpv !== wildVal) {
            allTriples.push({rank:tpv, indices:[tpC[0],tpC[1],wildIndices[0]], wIdx:[wildIndices[0]]});
          }
        }
      }
      for (var at = 0; at < allTriples.length; at++) {
        var tri = allTriples[at];
        // Find pairs not overlapping with triple indices
        for (var tp2 = 0; tp2 < gKeys.length; tp2++) {
          if (gKeys[tp2] === tri.rank) continue;
          var pairCands = [];
          for (var pc = 0; pc < groups[gKeys[tp2]].length; pc++) {
            if (tri.indices.indexOf(groups[gKeys[tp2]][pc]) < 0) pairCands.push(groups[gKeys[tp2]][pc]);
          }
          if (pairCands.length >= 2) {
            addPlay(plays, {type:"triple_pair",rank:tri.rank,count:5,indices:tri.indices.concat(pairCands.slice(0,2))});
          }
        }
        // Wild-assisted pair: 1 normal + 1 unused wild
        if (numWilds > tri.wIdx.length) {
          var unusedWild = null;
          for (var uw = 0; uw < wildIndices.length; uw++) {
            if (tri.wIdx.indexOf(wildIndices[uw]) < 0 && tri.indices.indexOf(wildIndices[uw]) < 0) {
              unusedWild = wildIndices[uw]; break;
            }
          }
          if (unusedWild !== null) {
            for (var tp3 = 0; tp3 < normKeys.length; tp3++) {
              var tp3v = normKeys[tp3];
              if (tp3v === tri.rank) continue;
              var tp3C = getNonWild(tp3v);
              var tp3avail = [];
              for (var tp3i = 0; tp3i < tp3C.length; tp3i++) {
                if (tri.indices.indexOf(tp3C[tp3i]) < 0) tp3avail.push(tp3C[tp3i]);
              }
              if (tp3avail.length >= 1) {
                addPlay(plays, {type:"triple_pair",rank:tri.rank,count:5,indices:tri.indices.concat([tp3avail[0], unusedWild])});
                break;
              }
            }
          }
        }
      }

      // Straights (5 consecutive, values 2-14) WITH wild substitution
      for (var start = 2; start <= 10; start++) {
        var seqIdx = [];
        var wildsUsedForSeq = 0;
        var wildIdxUsed = [];
        var valid = true;
        for (var sv = start; sv < start + 5; sv++) {
          var svCards = getNonWild(sv);
          if (svCards.length >= 1) {
            seqIdx.push(svCards[0]);
          } else if (wildsUsedForSeq < numWilds) {
            // Use a wild
            var wIdx = null;
            for (var swi = 0; swi < wildIndices.length; swi++) {
              if (wildIdxUsed.indexOf(wildIndices[swi]) < 0 && seqIdx.indexOf(wildIndices[swi]) < 0) {
                wIdx = wildIndices[swi]; break;
              }
            }
            if (wIdx !== null) {
              seqIdx.push(wIdx);
              wildIdxUsed.push(wIdx);
              wildsUsedForSeq++;
            } else {
              valid = false; break;
            }
          } else {
            valid = false; break;
          }
        }
        if (valid && seqIdx.length === 5) {
          addPlay(plays, {type:"straight",rank:start+4,count:5,indices:seqIdx});
        }
      }

      // Three consecutive pairs WITH wild substitution
      for (var cpStart = 2; cpStart <= 12; cpStart++) {
        if (cpStart + 2 > 14) continue;
        var cpIdx = [];
        var cpWildsUsed = [];
        var cpValid = true;
        for (var cpv = cpStart; cpv < cpStart + 3; cpv++) {
          var cpCards = getNonWild(cpv);
          var cpAvail = [];
          for (var cpi = 0; cpi < cpCards.length; cpi++) {
            if (cpIdx.indexOf(cpCards[cpi]) < 0) cpAvail.push(cpCards[cpi]);
          }
          var cpNeed = 2 - cpAvail.length;
          if (cpNeed > 0) {
            // Use wilds
            var cpWilds = [];
            for (var cwi = 0; cwi < wildIndices.length; cwi++) {
              if (cpWildsUsed.indexOf(wildIndices[cwi]) < 0 && cpIdx.indexOf(wildIndices[cwi]) < 0) {
                cpWilds.push(wildIndices[cwi]);
                if (cpWilds.length >= cpNeed) break;
              }
            }
            if (cpWilds.length < cpNeed) { cpValid = false; break; }
            for (var cwj = 0; cwj < cpNeed; cwj++) cpWildsUsed.push(cpWilds[cwj]);
            cpIdx = cpIdx.concat(cpAvail.slice(0, 2 - cpNeed)).concat(cpWilds.slice(0, cpNeed));
          } else {
            cpIdx = cpIdx.concat(cpAvail.slice(0, 2));
          }
        }
        if (cpValid && cpIdx.length === 6) {
          addPlay(plays, {type:"triple_pair_seq",rank:cpStart+2,count:6,indices:cpIdx});
        }
      }

      // Plate (2 consecutive triples) WITH wild substitution
      for (var plStart = 2; plStart <= 13; plStart++) {
        if (plStart + 1 > 14) continue;
        var plIdx = [];
        var plWildsUsed = [];
        var plValid = true;
        for (var plv = plStart; plv < plStart + 2; plv++) {
          var plCards = getNonWild(plv);
          var plAvail = [];
          for (var pli = 0; pli < plCards.length; pli++) {
            if (plIdx.indexOf(plCards[pli]) < 0) plAvail.push(plCards[pli]);
          }
          var plNeed = 3 - plAvail.length;
          if (plNeed > 0) {
            var plWilds = [];
            for (var pwi = 0; pwi < wildIndices.length; pwi++) {
              if (plWildsUsed.indexOf(wildIndices[pwi]) < 0 && plIdx.indexOf(wildIndices[pwi]) < 0) {
                plWilds.push(wildIndices[pwi]);
                if (plWilds.length >= plNeed) break;
              }
            }
            if (plWilds.length < plNeed) { plValid = false; break; }
            for (var pwj = 0; pwj < plNeed; pwj++) plWildsUsed.push(plWilds[pwj]);
            plIdx = plIdx.concat(plAvail.slice(0, 3 - plNeed)).concat(plWilds.slice(0, plNeed));
          } else {
            plIdx = plIdx.concat(plAvail.slice(0, 3));
          }
        }
        if (plValid && plIdx.length === 6) {
          addPlay(plays, {type:"plate",rank:plStart+1,count:6,indices:plIdx});
        }
      }

      // Tianwang
      var jokers = [];
      for (var jk = 0; jk < hand.length; jk++) {
        if (hand[jk].rank === "RJ" || hand[jk].rank === "BJ") jokers.push(jk);
      }
      if (jokers.length === 4) addPlay(plays, {type:"tianwang",rank:200,count:4,indices:jokers});

      return plays;
    }

    // ===== FOLLOWING A TRICK =====
    var validPlays = [];
    var tType = trick.type;
    var tRank = trick.rank;

    if (tType === "single") {
      for (var fs = 0; fs < gKeys.length; fs++) {
        if (gKeys[fs] > tRank) validPlays.push({type:"single",rank:gKeys[fs],count:1,indices:[groups[gKeys[fs]][0]]});
      }
    } else if (tType === "pair") {
      // Normal pairs
      for (var fp = 0; fp < gKeys.length; fp++) {
        if (groups[gKeys[fp]].length >= 2 && gKeys[fp] > tRank) {
          validPlays.push({type:"pair",rank:gKeys[fp],count:2,indices:groups[gKeys[fp]].slice(0,2)});
        }
      }
      // Wild-assisted pairs
      if (numWilds >= 1) {
        for (var fwp = 0; fwp < normKeys.length; fwp++) {
          var fwpv = normKeys[fwp];
          if (fwpv <= tRank || fwpv === wildVal) continue;
          var fwpC = getNonWild(fwpv);
          if (fwpC.length >= 1) {
            validPlays.push({type:"pair",rank:fwpv,count:2,indices:[fwpC[0], wildIndices[0]]});
          }
        }
      }
    } else if (tType === "triple") {
      for (var ft = 0; ft < gKeys.length; ft++) {
        if (groups[gKeys[ft]].length >= 3 && gKeys[ft] > tRank) {
          validPlays.push({type:"triple",rank:gKeys[ft],count:3,indices:groups[gKeys[ft]].slice(0,3)});
        }
      }
      // Wild-assisted triples
      if (numWilds >= 1) {
        for (var fwt = 0; fwt < normKeys.length; fwt++) {
          var fwtv = normKeys[fwt];
          if (fwtv <= tRank || fwtv === wildVal) continue;
          var fwtC = getNonWild(fwtv);
          if (fwtC.length >= 2) {
            validPlays.push({type:"triple",rank:fwtv,count:3,indices:[fwtC[0],fwtC[1],wildIndices[0]]});
          }
        }
      }
      if (numWilds >= 2) {
        for (var fwt2 = 0; fwt2 < normKeys.length; fwt2++) {
          var fwt2v = normKeys[fwt2];
          if (fwt2v <= tRank || fwt2v === wildVal) continue;
          var fwt2C = getNonWild(fwt2v);
          if (fwt2C.length >= 1) {
            validPlays.push({type:"triple",rank:fwt2v,count:3,indices:[fwt2C[0],wildIndices[0],wildIndices[1]]});
          }
        }
      }
    } else if (tType === "triple_pair") {
      // Use same logic as free lead but filter by rank > tRank
      var tpLeadPlays = [];
      // Generate all possible triple_pair from free lead logic
      var tpAll = allTriples || [];
      // Rebuild triples list for following
      var fTriples = [];
      for (var ftp0 = 0; ftp0 < gKeys.length; ftp0++) {
        if (groups[gKeys[ftp0]].length >= 3 && gKeys[ftp0] > tRank) {
          fTriples.push({rank:gKeys[ftp0], indices:groups[gKeys[ftp0]].slice(0,3), wIdx:[]});
        }
      }
      if (numWilds >= 1) {
        for (var ftp1 = 0; ftp1 < normKeys.length; ftp1++) {
          var ftpv = normKeys[ftp1];
          if (ftpv <= tRank || ftpv === wildVal) continue;
          var ftpC = getNonWild(ftpv);
          if (ftpC.length >= 2) {
            fTriples.push({rank:ftpv, indices:[ftpC[0],ftpC[1],wildIndices[0]], wIdx:[wildIndices[0]]});
          }
        }
      }
      for (var fat = 0; fat < fTriples.length; fat++) {
        var ftri = fTriples[fat];
        for (var ftp2 = 0; ftp2 < gKeys.length; ftp2++) {
          if (gKeys[ftp2] === ftri.rank) continue;
          var fpCands = [];
          for (var fpc = 0; fpc < groups[gKeys[ftp2]].length; fpc++) {
            if (ftri.indices.indexOf(groups[gKeys[ftp2]][fpc]) < 0) fpCands.push(groups[gKeys[ftp2]][fpc]);
          }
          if (fpCands.length >= 2) {
            validPlays.push({type:"triple_pair",rank:ftri.rank,count:5,indices:ftri.indices.concat(fpCands.slice(0,2))});
            break;
          }
        }
      }
    } else if (tType === "straight") {
      // Straights with wild substitution
      for (var fss = 2; fss <= 10; fss++) {
        if (fss + 4 <= tRank) continue;
        if (fss + 4 > 14) continue;
        var fsIdx = [];
        var fsWUsed = [];
        var fsOk = true;
        for (var fsv = fss; fsv < fss + 5; fsv++) {
          var fsC = getNonWild(fsv);
          var fsA = [];
          for (var fsa = 0; fsa < fsC.length; fsa++) {
            if (fsIdx.indexOf(fsC[fsa]) < 0) fsA.push(fsC[fsa]);
          }
          if (fsA.length >= 1) {
            fsIdx.push(fsA[0]);
          } else {
            var fwi = null;
            for (var fswi = 0; fswi < wildIndices.length; fswi++) {
              if (fsWUsed.indexOf(wildIndices[fswi]) < 0 && fsIdx.indexOf(wildIndices[fswi]) < 0) {
                fwi = wildIndices[fswi]; break;
              }
            }
            if (fwi !== null) { fsIdx.push(fwi); fsWUsed.push(fwi); }
            else { fsOk = false; break; }
          }
        }
        if (fsOk && fsIdx.length === 5 && fss + 4 > tRank) {
          validPlays.push({type:"straight",rank:fss+4,count:5,indices:fsIdx});
        }
      }
    } else if (tType === "triple_pair_seq") {
      for (var fcpS = 2; fcpS <= 12; fcpS++) {
        if (fcpS + 2 > 14 || fcpS + 2 <= tRank) continue;
        var fcpI = [], fcpW = [], fcpOk = true;
        for (var fcpv = fcpS; fcpv < fcpS + 3; fcpv++) {
          var fcpC = getNonWild(fcpv);
          var fcpA = [];
          for (var fcpa = 0; fcpa < fcpC.length; fcpa++) {
            if (fcpI.indexOf(fcpC[fcpa]) < 0) fcpA.push(fcpC[fcpa]);
          }
          var fcpNeed = 2 - Math.min(fcpA.length, 2);
          if (fcpNeed > 0) {
            var fcpWi = [];
            for (var fcwi = 0; fcwi < wildIndices.length; fcwi++) {
              if (fcpW.indexOf(wildIndices[fcwi]) < 0 && fcpI.indexOf(wildIndices[fcwi]) < 0) {
                fcpWi.push(wildIndices[fcwi]);
                if (fcpWi.length >= fcpNeed) break;
              }
            }
            if (fcpWi.length < fcpNeed) { fcpOk = false; break; }
            for (var fcwj = 0; fcwj < fcpNeed; fcwj++) fcpW.push(fcpWi[fcwj]);
            fcpI = fcpI.concat(fcpA.slice(0, 2 - fcpNeed)).concat(fcpWi.slice(0, fcpNeed));
          } else {
            fcpI = fcpI.concat(fcpA.slice(0, 2));
          }
        }
        if (fcpOk && fcpI.length === 6) {
          validPlays.push({type:"triple_pair_seq",rank:fcpS+2,count:6,indices:fcpI});
        }
      }
    } else if (tType === "plate") {
      for (var fplS = 2; fplS <= 13; fplS++) {
        if (fplS + 1 > 14 || fplS + 1 <= tRank) continue;
        var fplI = [], fplW = [], fplOk = true;
        for (var fplv = fplS; fplv < fplS + 2; fplv++) {
          var fplC = getNonWild(fplv);
          var fplA = [];
          for (var fpla = 0; fpla < fplC.length; fpla++) {
            if (fplI.indexOf(fplC[fpla]) < 0) fplA.push(fplC[fpla]);
          }
          var fplNeed = 3 - Math.min(fplA.length, 3);
          if (fplNeed > 0) {
            var fplWi = [];
            for (var fpwi = 0; fpwi < wildIndices.length; fpwi++) {
              if (fplW.indexOf(wildIndices[fpwi]) < 0 && fplI.indexOf(wildIndices[fpwi]) < 0) {
                fplWi.push(wildIndices[fpwi]);
                if (fplWi.length >= fplNeed) break;
              }
            }
            if (fplWi.length < fplNeed) { fplOk = false; break; }
            for (var fpwj = 0; fpwj < fplNeed; fpwj++) fplW.push(fplWi[fpwj]);
            fplI = fplI.concat(fplA.slice(0, 3 - fplNeed)).concat(fplWi.slice(0, fplNeed));
          } else {
            fplI = fplI.concat(fplA.slice(0, 3));
          }
        }
        if (fplOk && fplI.length === 6) {
          validPlays.push({type:"plate",rank:fplS+1,count:6,indices:fplI});
        }
      }
    }

    // Bombs can always be played (no wild substitution for bombs in following)
    if (tType !== "tianwang") {
      for (var fb = 0; fb < gKeys.length; fb++) {
        if (groups[gKeys[fb]].length >= 4) {
          for (var fbc = 4; fbc <= groups[gKeys[fb]].length; fbc++) {
            var bombPlay = {type:"bomb",rank:gKeys[fb]+fbc*0.01,count:fbc,indices:groups[gKeys[fb]].slice(0,fbc)};
            if (canBeat(bombPlay, trick)) validPlays.push(bombPlay);
          }
        }
      }
      var fjokers = [];
      for (var fjk = 0; fjk < hand.length; fjk++) {
        if (hand[fjk].rank === "RJ" || hand[fjk].rank === "BJ") fjokers.push(fjk);
      }
      if (fjokers.length === 4) validPlays.push({type:"tianwang",rank:200,count:4,indices:fjokers});
    }
    return validPlays;
  }


  // ==================== AI ENGINE ====================

  // --- 1. HAND STRUCTURE ---
  function analyzeHandStructure(hand) {
    var groups = {};
    for (var i = 0; i < hand.length; i++) {
      var v = cardValue(hand[i]);
      if (!groups[v]) groups[v] = [];
      groups[v].push(i);
    }
    var gKeys = Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
    var bombs = [], triples = [], pairs = [], singles = [];
    for (var k = 0; k < gKeys.length; k++) {
      var len = groups[gKeys[k]].length;
      if (len >= 4) bombs.push(gKeys[k]);
      else if (len === 3) triples.push(gKeys[k]);
      else if (len === 2) pairs.push(gKeys[k]);
      else singles.push(gKeys[k]);
    }
    return { groups: groups, gKeys: gKeys, bombs: bombs, triples: triples, pairs: pairs, singles: singles };
  }

  // --- 2. OPTIMAL HAND DECOMPOSITION ---
  // Find minimum "hands" needed considering straights, consecutive pairs, plates
  function countHandsNeeded(hand) {
    if (hand.length === 0) return 0;
    var info = analyzeHandStructure(hand);
    var groups = info.groups;
    var gKeys = info.gKeys;

    // Make a copy of counts for simulation
    var counts = {};
    for (var i = 0; i < gKeys.length; i++) {
      counts[gKeys[i]] = groups[gKeys[i]].length;
    }

    var hands = 0;

    // 1. Extract bombs (4+ same) - always keep as 1 hand
    for (var bi = 0; bi < info.bombs.length; bi++) {
      hands++;
      counts[info.bombs[bi]] = 0;
    }

    // 2. Try to find straights (5 consecutive values <= 14)
    var lowKeys = gKeys.filter(function(k) { return k <= 14 && counts[k] > 0; });
    var foundStraight = true;
    while (foundStraight) {
      foundStraight = false;
      for (var si = 0; si < lowKeys.length; si++) {
        var start = lowKeys[si];
        if (counts[start] <= 0) continue;
        // Check if 5 consecutive available
        var canStraight = true;
        for (var sj = 0; sj < 5; sj++) {
          if (!counts[start + sj] || counts[start + sj] <= 0) { canStraight = false; break; }
        }
        if (canStraight && start + 4 <= 14) {
          hands++;
          for (var sk = 0; sk < 5; sk++) counts[start + sk]--;
          foundStraight = true;
          break;
        }
      }
    }

    // 3. Try three-consecutive-pairs (3 consecutive with 2+ each)
    for (var cp = 0; cp < lowKeys.length; cp++) {
      var v = lowKeys[cp];
      if (counts[v] >= 2 && counts[v+1] && counts[v+1] >= 2 && counts[v+2] && counts[v+2] >= 2 && v+2 <= 14) {
        hands++;
        counts[v] -= 2; counts[v+1] -= 2; counts[v+2] -= 2;
      }
    }

    // 4. Try plates (2 consecutive triples)
    for (var pl = 0; pl < lowKeys.length; pl++) {
      var pv = lowKeys[pl];
      if (counts[pv] >= 3 && counts[pv+1] && counts[pv+1] >= 3 && pv+1 <= 14) {
        hands++;
        counts[pv] -= 3; counts[pv+1] -= 3;
      }
    }

    // 5. Three + pair combos
    var remainTriples = [];
    var remainPairs = [];
    var remainSingles = [];
    for (var ri = 0; ri < gKeys.length; ri++) {
      var rc = counts[gKeys[ri]] || 0;
      if (rc >= 3) { remainTriples.push(gKeys[ri]); counts[gKeys[ri]] -= 3; rc -= 3; }
      if (rc >= 2) { remainPairs.push(gKeys[ri]); counts[gKeys[ri]] -= 2; rc -= 2; }
      if (rc >= 1) { remainSingles.push(gKeys[ri]); counts[gKeys[ri]] -= 1; }
    }

    // Pair triples with pairs for 3+2
    var freePairs = remainPairs.length;
    for (var ti = 0; ti < remainTriples.length; ti++) {
      hands++;
      if (freePairs > 0) freePairs--;
    }
    hands += freePairs;
    hands += remainSingles.length;

    return hands;
  }

  function handsAfterPlay(play, hand) {
    var rem = [];
    for (var i = 0; i < hand.length; i++) {
      if (play.indices.indexOf(i) < 0) rem.push(hand[i]);
    }
    return countHandsNeeded(rem);
  }

  // --- 3. CARD COUNTING ---
  function getPlayedCounts() {
    var c = {};
    for (var i = 0; i < gameState.playedCards.length; i++) {
      var r = gameState.playedCards[i].rank;
      c[r] = (c[r] || 0) + 1;
    }
    return c;
  }

  function estimateWinChance(playRank, hand) {
    var played = getPlayedCounts();
    var myGrp = analyzeHandStructure(hand).groups;
    var higher = 0;
    for (var ri = 0; ri < RANKS.length; ri++) {
      var r = RANKS[ri];
      var rv = RANK_ORDER[r] || 0;
      if (r === getLevelRankName()) rv = 15.5;
      if (rv <= playRank) continue;
      higher += Math.max(0, 8 - (played[r] || 0) - (myGrp[rv] ? myGrp[rv].length : 0));
    }
    if (playRank < 99) {
      var bm = 0; for (var j = 0; j < hand.length; j++) { if (hand[j].rank === "BJ") bm++; }
      higher += Math.max(0, 2 - (played["BJ"] || 0) - bm);
    }
    if (playRank < 100) {
      var rm = 0; for (var j2 = 0; j2 < hand.length; j2++) { if (hand[j2].rank === "RJ") rm++; }
      higher += Math.max(0, 2 - (played["RJ"] || 0) - rm);
    }
    if (higher === 0) return 1.0;
    if (higher <= 2) return 0.75;
    if (higher <= 5) return 0.4;
    if (higher <= 10) return 0.2;
    return 0.05;
  }

  // --- 4. FORMATION PROTECTION (HARD RULES) ---
  function getBreakPenalty(play, info) {
    var penalty = 0;

    for (var bi = 0; bi < info.bombs.length; bi++) {
      var bombVal = info.bombs[bi];
      var bIdx = info.groups[bombVal];
      var bombSize = bIdx.length;
      var used = 0;
      for (var pi = 0; pi < play.indices.length; pi++) {
        if (bIdx.indexOf(play.indices[pi]) >= 0) used++;
      }
      if (used > 0 && used < bombSize) {
        // Splitting a bomb! Check if exception applies:
        // Exception: 5+ card bomb, taking 1 card to complete a straight
        if (bombSize >= 5 && used === 1 && play.type === "straight") {
          // Acceptable split: still leaves a 4+ bomb, and we get a straight
          penalty += 50; // Small penalty, not forbidden
        } else if (bombSize >= 5 && used === 1 && play.type === "triple_pair_seq") {
          penalty += 80; // Slightly worse but acceptable
        } else {
          // ABSOLUTE BAN: never split 4-card bombs, never split more than 1
          penalty += 5000;
        }
      }
    }

    // Strong: don't break triples (unless playing triple or triple_pair)
    for (var ti = 0; ti < info.triples.length; ti++) {
      var tIdx = info.groups[info.triples[ti]];
      var usedT = 0;
      for (var pj = 0; pj < play.indices.length; pj++) {
        if (tIdx.indexOf(play.indices[pj]) >= 0) usedT++;
      }
      if (usedT > 0 && usedT < 3 && play.type !== "triple_pair" && play.type !== "triple") penalty += 300;
    }

    // Moderate: don't break pairs for singles
    if (play.type === "single" && info.groups[play.rank] && info.groups[play.rank].length >= 2) {
      penalty += 150;
    }
    return penalty;
  }

  // --- 5. ROLE EVALUATION ---
  function evaluateRole(seat) {
    var myHands = countHandsNeeded(gameState.hands[seat]);
    var partnerHands = countHandsNeeded(gameState.hands[(seat + 2) % 4]);
    var info = analyzeHandStructure(gameState.hands[seat]);
    if (myHands <= partnerHands) return "attacker";
    if (myHands > partnerHands + 3) return "helper";
    if (info.bombs.length >= 1) return "attacker";
    return "balanced";
  }

  // --- 6. LEAD SCORING ---
  // --- 6. LEAD SCORING ---
  function scoreLeadPlay(play, hand, seat) {
    var score = 0;
    var info = analyzeHandStructure(hand);
    var hBefore = countHandsNeeded(hand);
    var hAfter = handsAfterPlay(play, hand);
    var hReduce = hBefore - hAfter;
    var endgame = (hBefore <= 3);
    var lateGame = (hBefore <= 6 && !endgame);
    var role = evaluateRole(seat);

    if (play.count === hand.length) return 10000;

    // --- OPPONENT THREAT ANALYSIS ---
    var opps = (seat % 2 === 0) ? [1, 3] : [0, 2];
    var minOppCards = 99;
    for (var oi = 0; oi < opps.length; oi++) {
      var oLen = gameState.hands[opps[oi]].length;
      if (gameState.finishOrder.indexOf(opps[oi]) < 0 && oLen < minOppCards) {
        minOppCards = oLen;
      }
    }

    // CRITICAL: If opponent has 1 card, NEVER play singles - they follow and win!
    if (minOppCards === 1 && play.type === "single") {
      score -= 500;
    }
    // Opponent has 2 cards: avoid singles
    if (minOppCards === 2 && play.type === "single") {
      score -= 200;
    }
    // Opponent has 1-2 cards: strongly prefer multi-card plays they can't follow
    if (minOppCards <= 2 && play.count >= 2) {
      score += 150;
    }
    // Opponent has 3 cards: small singles are risky
    if (minOppCards <= 3 && play.type === "single" && play.rank <= 10) {
      score -= 80;
    }
    // If opponent has very few cards, prefer playing BIG singles (if we must play single)
    if (minOppCards <= 2 && play.type === "single" && play.rank >= 14) {
      score += 60; // At least play a winner
    }

    // Type base
    var ts = {"straight":80,"triple_pair_seq":85,"plate":85,"triple_pair":60,
              "triple":30,"pair":25,"single":5,"bomb":-80,"tianwang":-150,"flush_straight":-60};
    score += (ts[play.type] || 0);
    score += play.count * 8;
    score -= getBreakPenalty(play, info);

    // True singleton bonus (reduced when opponents are close to finishing)
    if (play.type === "single" && info.groups[play.rank] && info.groups[play.rank].length === 1) {
      if (minOppCards > 3) {
        score += 45;
      } else {
        score += 5;
      }
    }

    // Hand reduction always good
    score += hReduce * 15;

    if (endgame) {
      var wc = estimateWinChance(play.rank, hand);
      score += wc * 120;
      score += hReduce * 35;
      if (hAfter <= 1) score += 100;
      if (wc < 0.2 && play.type === "single") score -= 70;
      if (play.type === "bomb") score += 100;
      if (play.type === "tianwang") score += 80;
    } else if (lateGame) {
      var wcL = estimateWinChance(play.rank, hand);
      score += wcL * 20;
      score += hReduce * 10;
      score += Math.max(0, (14 - play.rank)) * 2;
    } else {
      score += Math.max(0, (14 - play.rank)) * 4;
      if (play.rank >= 99) score -= 100;
      if (play.rank >= 15) score -= 30;
      if (play.rank >= 14) score -= 15;
      if (role === "helper" && play.type === "single") score += 10;
      if (role === "attacker") score += play.count * 5;
    }

    return score;
  }


  // --- 7. FOLLOW SCORING ---
  function scoreFollowPlay(play, hand, trick, seat) {
    var score = 0;
    var info = analyzeHandStructure(hand);
    var hBefore = countHandsNeeded(hand);
    var hAfter = handsAfterPlay(play, hand);
    var endgame = (hBefore <= 3);

    if (play.count === hand.length) return 10000;
    score -= getBreakPenalty(play, info);
    score += (hBefore - hAfter) * 15;

    if (endgame) {
      score += 20;
      if (play.type === "bomb") score -= 5;
    } else {
      score += Math.max(0, (20 - play.rank)) * 5;
      if (play.type === "bomb") score -= 80;
      if (play.type === "tianwang") score -= 150;
      if (play.type === "flush_straight") score -= 60;
      if (play.rank >= 99) score -= 60;
    }
    return score;
  }

  // --- 8. BOMB DECISION ---
  function shouldBomb(seat, trick) {
    var hand = gameState.hands[seat];
    var hNeeded = countHandsNeeded(hand);
    var opps = (seat % 2 === 0) ? [1, 3] : [0, 2];
    var oppClose = false;
    var oppVeryClose = false;
    for (var i = 0; i < opps.length; i++) {
      var oLen = gameState.hands[opps[i]].length;
      if (gameState.finishOrder.indexOf(opps[i]) < 0) {
        if (oLen <= 5) oppClose = true;
        if (oLen <= 2) oppVeryClose = true;
      }
    }
    // Always bomb if opponent is about to win
    if (oppVeryClose) return true;
    // Bomb if we're in endgame (3 hands or fewer)
    if (hNeeded <= 3) return true;
    // Bomb if opponent close AND we don't have too many hands left
    if (oppClose && hNeeded <= 6) return true;
    // Bomb if trick is very strong (A or higher) AND we have reasonable hand
    if (trick && trick.rank >= 14 && hNeeded <= 8) return true;
    // Very rarely bomb otherwise — only 5% chance, and only when opponent played
    if (trick && opps.indexOf(gameState.lastPlayedBy) >= 0 && hNeeded <= 8 && Math.random() < 0.05) return true;
    // NEVER bomb with many hands needed (>8) — save the bomb
    return false;
  }

  // --- 9. UTILITY ---
  function pickBestPlay(plays, hand, trick, seat) {
    if (plays.length === 0) return null;
    var best = plays[0], bestS = -99999;
    for (var i = 0; i < plays.length; i++) {
      var s = trick ? scoreFollowPlay(plays[i], hand, trick, seat) : scoreLeadPlay(plays[i], hand, seat);
      if (s > bestS) { bestS = s; best = plays[i]; }
    }
    return best;
  }

  function sortPlaysByScore(plays, hand, trick, seat) {
    var arr = [];
    for (var i = 0; i < plays.length; i++) {
      var s = trick ? scoreFollowPlay(plays[i], hand, trick, seat) : scoreLeadPlay(plays[i], hand, seat);
      arr.push({ play: plays[i], score: s });
    }
    arr.sort(function(a, b) { return b.score - a.score; });
    var res = [];
    for (var j = 0; j < arr.length; j++) res.push(arr[j].play);
    return res;
  }

  // --- 10. MAIN AI ---
  function aiPlay(seat) {
    var hand = gameState.hands[seat];
    var n = hand.length;
    if (n === 0) return null;
    var trick = gameState.currentTrick;
    var partner = (seat + 2) % 4;
    var opps = (seat % 2 === 0) ? [1, 3] : [0, 2];
    var partnerWin = (gameState.lastPlayedBy === partner);
    var oppVC = false;
    for (var oi = 0; oi < opps.length; oi++) {
      if (gameState.hands[opps[oi]].length <= 2 && gameState.finishOrder.indexOf(opps[oi]) < 0) oppVC = true;
    }

    // FREE LEAD
    if (!trick) {
      var allP = findAllPlays(hand, null);
      if (allP.length === 0) return null;
      var cands = [];
      var hNeeded = countHandsNeeded(hand);
      for (var ci = 0; ci < allP.length; ci++) {
        var pt = allP[ci].type;
        if (pt !== "bomb" && pt !== "tianwang" && pt !== "flush_straight") cands.push(allP[ci]);
      }
      if (cands.length === 0 || hNeeded <= 3) cands = allP;
      return pickBestPlay(cands, hand, null, seat);
    }

    // FOLLOWING
    var plays = findAllPlays(hand, trick);
    if (plays.length === 0) return null;

    // Partner winning — don't beat (unless finish)
    if (partnerWin) {
      for (var pw = 0; pw < plays.length; pw++) { if (plays[pw].count === n) return plays[pw]; }
      return null;
    }
    // Can finish?
    for (var cf = 0; cf < plays.length; cf++) { if (plays[cf].count === n) return plays[cf]; }

    var norm = [], bomb = [];
    for (var ni = 0; ni < plays.length; ni++) {
      var nt = plays[ni].type;
      if (nt === "bomb" || nt === "tianwang" || nt === "flush_straight") bomb.push(plays[ni]);
      else norm.push(plays[ni]);
    }

    if (norm.length > 0) {
      if (oppVC) { norm.sort(function(a,b){return b.rank-a.rank;}); return norm[0]; }
      return pickBestPlay(norm, hand, trick, seat);
    }

    if (bomb.length > 0 && shouldBomb(seat, trick)) {
      bomb.sort(function(a,b){return a.rank-b.rank;});
      return bomb[0];
    }
    return null;
  }

  // ==================== GAME FLOW ====================
  function nextSeat(seat) {
    var next = (seat + 1) % 4;
    var tried = 0;
    while (gameState.finishOrder.indexOf(next) >= 0 && tried < 4) { next = (next + 1) % 4; tried++; }
    return next;
  }

  function removeCards(seat, indices) {
    indices.sort(function(a,b){return b-a;});
    var removed = [];
    for (var i = 0; i < indices.length; i++) removed.push(gameState.hands[seat].splice(indices[i], 1)[0]);
    return removed;
  }

  function executePlay(seat, play) {
    if (play) {
      var cards = removeCards(seat, play.indices);
      gameState.currentTrick = { type: play.type, rank: play.rank, count: play.count, cards: cards, player: seat };
      gameState.lastPlays[seat] = cards;
      gameState.consecutivePasses = 0;
      gameState.lastPlayedBy = seat;
      gameState.isFirstPlay = false;
      // Record cards to memory
      for (var mi = 0; mi < cards.length; mi++) {
        gameState.playedCards.push({ rank: cards[mi].rank, suit: cards[mi].suit, seat: seat });
      }
      if (play.type === "bomb" || play.type === "tianwang" || play.type === "flush_straight") playSound("bomb");
      else playSound("play");
      if (gameState.hands[seat].length === 0) {
        gameState.finishOrder.push(seat);
        if (checkRoundEnd()) { afterStateChange(); return; }
      }
    } else {
      gameState.lastPlays[seat] = "pass";
      gameState.consecutivePasses++;
      playSound("pass");
      var activePlayers = [];
      for (var a = 0; a < 4; a++) { if (gameState.finishOrder.indexOf(a) < 0) activePlayers.push(a); }
      if (gameState.consecutivePasses >= activePlayers.length - 1) {
        gameState.currentTrick = null;
        gameState.lastPlays = [null, null, null, null];
        gameState.consecutivePasses = 0;
        gameState.isFirstPlay = true;
        var leader = gameState.lastPlayedBy;
        if (gameState.finishOrder.indexOf(leader) >= 0) {
          var partner = (leader + 2) % 4;
          if (gameState.finishOrder.indexOf(partner) < 0) leader = partner;
          else leader = nextSeat(leader);
        }
        gameState.currentPlayer = leader;
        updateUI();
        afterStateChange();
        if (isAISeat(leader)) setTimeout(aiTurn, 700);
        return;
      }
    }
    gameState.currentPlayer = nextSeat(seat);
    updateUI();
    afterStateChange();
    if (isAISeat(gameState.currentPlayer) && gameState.roundActive) setTimeout(aiTurn, 550);
  }

  function checkRoundEnd() {
    var fo = gameState.finishOrder;
    if (fo.length >= 2) {
      var aFinished = 0;
      var bFinished = 0;
      if (fo.indexOf(0) >= 0) aFinished++;
      if (fo.indexOf(2) >= 0) aFinished++;
      if (fo.indexOf(1) >= 0) bFinished++;
      if (fo.indexOf(3) >= 0) bFinished++;
      if (aFinished === 2 || bFinished === 2 || fo.length >= 3) { endRound(); return true; }
    }
    if (fo.length >= 3) { endRound(); return true; }
    return false;
  }

  function endRound() {
    gameState.roundActive = false;
    for (var r = 0; r < 4; r++) {
      if (gameState.finishOrder.indexOf(r) < 0) gameState.finishOrder.push(r);
    }
    var fo = gameState.finishOrder;
    var first = fo[0];
    var winnerIsA = (first % 2 === 0);
    var partnerPos = fo.indexOf((first + 2) % 4);
    var upgrade = (partnerPos === 1) ? 3 : (partnerPos === 2) ? 2 : 1;

    // A级必打规则：打A时，队友必须不是末游才算过A
    var currentLevel = winnerIsA ? gameState.teamALevel : gameState.teamBLevel;
    var passedA = false;

    if (currentLevel === 14) {
      // At A level: must have partner NOT be last (末游)
      if (partnerPos < 3) {
        // Partner is not last — passed A!
        passedA = true;
      } else {
        // Partner is last — failed to pass A, no upgrade
        upgrade = 0;
      }
    }

    // Apply upgrade
    if (winnerIsA) {
      gameState.teamALevel = Math.min(15, gameState.teamALevel + upgrade);
      gameState.level = gameState.teamALevel;
    } else {
      gameState.teamBLevel = Math.min(15, gameState.teamBLevel + upgrade);
      gameState.level = gameState.teamBLevel;
    }

    // Check for game victory (passed A, level > 14)
    var gameOver = false;
    var gameWinnerIsA = false;
    if (gameState.teamALevel > 14) { gameOver = true; gameWinnerIsA = true; }
    if (gameState.teamBLevel > 14) { gameOver = true; gameWinnerIsA = false; }

    playSound(winnerIsA ? "win" : "pass");

    var posNames = ["\u5934\u6e38", "\u4e8c\u6e38", "\u4e09\u6e38", "\u672b\u6e38"];
    var resultLines = "";
    for (var i = 0; i < fo.length; i++) {
      resultLines += posNames[i] + ": " + SEAT_NAMES[fo[i]];
      if (i < fo.length - 1) resultLines += "<br>";
    }

    if (gameOver) {
      // GAME OVER — someone passed A!
      if (gameWinnerIsA) {
        document.getElementById("resultTitle").textContent = "\ud83c\udfc6 \u606d\u559c\uff01\u6211\u65b9\u83b7\u5f97\u6700\u7ec8\u80dc\u5229\uff01";
        // 恭喜！我方获得最终胜利！
      } else {
        document.getElementById("resultTitle").textContent = "\ud83d\ude22 \u5bf9\u65b9\u83b7\u5f97\u6700\u7ec8\u80dc\u5229";
        // 对方获得最终胜利
      }
      document.getElementById("resultInfo").innerHTML = resultLines + "<br><br>" +
        (gameWinnerIsA ? "\u6211\u65b9" : "\u5bf9\u65b9") + "\u6210\u529f\u6253\u8fc7A\uff01<br><br>" +
        "\u6e38\u620f\u7ed3\u675f\uff0c\u91cd\u65b0\u5f00\u59cb";
        // 成功打过A！ 游戏结束，重新开始
      document.getElementById("btnNext").textContent = "\u91cd\u65b0\u5f00\u59cb";
      // 重新开始
      gameState.teamALevel = 2;
      gameState.teamBLevel = 2;
      gameState.level = 2;
    } else {
      // Normal round end
      document.getElementById("resultTitle").textContent = winnerIsA ? "\ud83c\udf89 \u6211\u65b9\u83b7\u80dc\uff01" : "\ud83d\ude1e \u5bf9\u65b9\u83b7\u80dc";
      var upgradeText = "";
      if (upgrade > 0) {
        upgradeText = (winnerIsA ? "\u6211\u65b9" : "\u5bf9\u65b9") + "\u5347" + upgrade + "\u7ea7";
      } else {
        upgradeText = "\u6253A\u5931\u8d25\uff0c\u672a\u80fd\u8fc7A";
        // 打A失败，未能过A
      }
      document.getElementById("resultInfo").innerHTML = resultLines + "<br><br>" +
        upgradeText + "<br>" +
        "\u6211\u65b9: " + levelName(gameState.teamALevel) + " | \u5bf9\u65b9: " + levelName(gameState.teamBLevel);
      document.getElementById("btnNext").textContent = "\u4e0b\u4e00\u5c40";
      // 下一局
    }
    document.getElementById("overlay").classList.remove("hidden");
  }

  function aiTurn() {
    if (!gameState.roundActive || !isAISeat(gameState.currentPlayer)) return;
    executePlay(gameState.currentPlayer, aiPlay(gameState.currentPlayer));
  }

  // ==================== PLAYER ACTIONS ====================
  function doPlay() {
    if (Net.mode === "guest") { guestSendAction("play"); return; }
    if (gameState.currentPlayer !== 0 || !gameState.roundActive) return;
    var selected = [];
    for (var i = 0; i < gameState.hands[0].length; i++) {
      if (gameState.hands[0][i]._selected) selected.push(i);
    }
    if (selected.length === 0) return;
    var cards = [];
    for (var j = 0; j < selected.length; j++) cards.push(gameState.hands[0][selected[j]]);
    var playType = detectType(cards);
    if (!playType) { showMsg("\u65e0\u6548\u724c\u578b\uff01"); return; }
    if (gameState.currentTrick && !canBeat(playType, gameState.currentTrick)) { showMsg("\u6253\u4e0d\u8fc7\uff01"); return; }
    for (var k = 0; k < gameState.hands[0].length; k++) gameState.hands[0][k]._selected = false;
    executePlay(0, { type: playType.type, rank: playType.rank, count: playType.count, indices: selected });
  }

  function doPass() {
    if (Net.mode === "guest") { guestSendAction("pass"); return; }
    if (gameState.currentPlayer !== 0 || !gameState.roundActive || gameState.isFirstPlay) return;
    if (!gameState.currentTrick) { showMsg("\u5fc5\u987b\u51fa\u724c\uff01"); return; }
    for (var i = 0; i < gameState.hands[0].length; i++) gameState.hands[0][i]._selected = false;
    executePlay(0, null);
  }

  function doHint() {
    if (gameState.currentPlayer !== 0 || !gameState.roundActive) return;
    var hand = gameState.hands[0];
    var trick = gameState.currentTrick;
    var plays = findAllPlays(hand, trick);
    if (plays.length === 0) { showMsg("\u6ca1\u6709\u53ef\u51fa\u7684\u724c"); return; }

    // Pre-filter: remove plays that illegally break bombs
    // Exception: 5+ card bomb can lose 1 card to form a straight
    var info = analyzeHandStructure(hand);
    var filtered = [];
    for (var f = 0; f < plays.length; f++) {
      var illegalBreak = false;
      for (var bi = 0; bi < info.bombs.length; bi++) {
        var bombIndices = info.groups[info.bombs[bi]];
        var bombSize = bombIndices.length;
        var used = 0;
        for (var pi = 0; pi < plays[f].indices.length; pi++) {
          if (bombIndices.indexOf(plays[f].indices[pi]) >= 0) used++;
        }
        if (used > 0 && used < bombSize) {
          // Check exception: 5+ bomb, 1 card taken, for straight/seq
          var isException = (bombSize >= 5 && used === 1 &&
            (plays[f].type === "straight" || plays[f].type === "triple_pair_seq"));
          if (!isException) { illegalBreak = true; break; }
        }
      }
      if (!illegalBreak) filtered.push(plays[f]);
    }
    if (filtered.length === 0) filtered = plays;

    // Sort plays by smart score (best first)
    var sorted = sortPlaysByScore(filtered, hand, trick, 0);

    // Remove duplicates (same type+rank)
    var unique = [];
    var seen = {};
    for (var u = 0; u < sorted.length; u++) {
      var key = sorted[u].type + "_" + sorted[u].rank + "_" + sorted[u].count;
      if (!seen[key]) {
        seen[key] = true;
        unique.push(sorted[u]);
      }
    }

    for (var i = 0; i < hand.length; i++) hand[i]._selected = false;
    hintIndex = hintIndex % unique.length;
    var indices = unique[hintIndex].indices;
    for (var j = 0; j < indices.length; j++) hand[indices[j]]._selected = true;
    hintIndex++;
    renderHand();
  }

  function toggleCheat() {
    cheatMode = !cheatMode;
    document.getElementById("btnCheat").classList.toggle("active", cheatMode);
    updateUI();
  }

  function showMsg(text) {
    var el = document.getElementById("statusMsg");
    el.textContent = text;
    el.style.display = "block";
    setTimeout(function() { el.style.display = "none"; }, 1100);
  }

  function startRound() {
    if (Net.mode === "guest") { showMsg("等待房主开始"); return; }
    deal();
    gameState.currentTrick = null;
    gameState.currentPlayer = 0;
    gameState.finishOrder = [];
    gameState.roundActive = true;
    gameState.lastPlays = [null, null, null, null];
    gameState.consecutivePasses = 0;
    gameState.lastPlayedBy = -1;
    gameState.isFirstPlay = true;
    gameState.playedCards = [];
    hintIndex = 0;
    document.getElementById("overlay").classList.add("hidden");
    updateUI();
    afterStateChange();
    if (isAISeat(gameState.currentPlayer)) setTimeout(aiTurn, 700);
  }

  function nextRound() {
    if (Net.mode === "guest") { showMsg("等待房主开下一局"); return; }
    startRound();
  }

  // ==================== EVENT BINDINGS ====================
  document.getElementById("btnPlay").addEventListener("click", doPlay);
  document.getElementById("btnPass").addEventListener("click", doPass);
  document.getElementById("btnHint").addEventListener("click", doHint);
  document.getElementById("btnCheat").addEventListener("click", toggleCheat);
  document.getElementById("btnNext").addEventListener("click", nextRound);

  // ==================== START ====================
  window.__GD = {
    gameState: gameState,
    startRound: startRound,
    executePlay: executePlay,
    aiTurn: aiTurn,
    updateUI: updateUI,
    getState: function(){ return clonePlain(gameState); },
    applyState: applyState,
    getNet: function(){ return Net; }
  };
  initMenu();
  setSeatNameMap(["你","电脑B","对家","电脑D"], seatTypesByMode("single"));
  updateUI();

})();
</script>
